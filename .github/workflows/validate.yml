name: InstaScope validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check, tests, lint, formatting, build, and dependency audit
        run: |
          pnpm run typecheck
          pnpm test
          pnpm lint
          pnpm format:check
          pnpm run build
          pnpm audit --audit-level moderate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production browser and accessibility tests
        run: pnpm test:e2e

      - name: Retain Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: instascope-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          output: ${{ runner.temp }}/instascope-codeql-results
          upload: never
          upload-database: false

      - name: Retain CodeQL SARIF results
        uses: actions/upload-artifact@v4.6.2
        with:
          name: instascope-codeql-results
          path: ${{ runner.temp }}/instascope-codeql-results/
          retention-days: 7
